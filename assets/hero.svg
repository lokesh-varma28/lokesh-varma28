<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian / Navy -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0B1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Champagne Gold Accent Gradient -->
    <linearGradient id="hero-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Sheen Beam Gradient -->
    <linearGradient id="hero-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Aurora Blur Filter -->
    <filter id="aurora-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="55" />
    </filter>

    <clipPath id="hero-clip">
      <rect width="900" height="320" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    @media (prefers-reduced-motion: no-preference) {
      .aurora-gold {
        animation: driftGold 18s ease-in-out infinite alternate;
      }
      .aurora-blue {
        animation: driftBlue 22s ease-in-out infinite alternate;
      }
      .sheen-beam {
        animation: sheenSweep 9s ease-in-out infinite;
      }
      .beacon-ring {
        animation: pulseRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    }
    @keyframes driftGold {
      0% { transform: translate(0px, 0px); opacity: 0.16; }
      100% { transform: translate(100px, 30px); opacity: 0.24; }
    }
    @keyframes driftBlue {
      0% { transform: translate(0px, 0px); opacity: 0.12; }
      100% { transform: translate(-80px, -25px); opacity: 0.20; }
    }
    @keyframes sheenSweep {
      0% { transform: translateX(-900px); }
      35%, 100% { transform: translateX(1100px); }
    }
    @keyframes pulseRing {
      0% { r: 4.5px; opacity: 0.9; }
      70% { r: 11px; opacity: 0; }
      100% { r: 11px; opacity: 0; }
    }
  </style>

  <!-- Opaque Rounded Dark Plate -->
  <g clip-path="url(#hero-clip)">
    <rect width="900" height="320" rx="16" fill="url(#hero-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- Ambient Aurora Glow Orbs -->
    <g filter="url(#aurora-blur)">
      <circle cx="200" cy="90" r="140" fill="#E5C07B" class="aurora-gold" />
      <circle cx="760" cy="220" r="160" fill="#38BDF8" class="aurora-blue" />
    </g>

    <!-- Subtle Diagonal Sheen Beam -->
    <rect x="-300" y="-100" width="220" height="520" fill="url(#hero-sheen)" transform="skewX(-25)" class="sheen-beam" pointer-events="none" />

    <!-- 0. Eyebrow Badge -->
    <text x="44" y="44" class="font-mono" font-size="12" font-weight="700" fill="#E5C07B" letter-spacing="2">FULL-STACK ARCHITECTURE &amp; ENGINEERING</text>

    <!-- 1. Name -->
    <text x="44" y="94" class="font-sans" font-size="48" font-weight="900" fill="#F8FAFC" letter-spacing="0.8">LOKESH VARMA</text>

    <!-- 2. Primary Identity -->
    <text x="44" y="136" class="font-sans" font-size="26" font-weight="800" fill="url(#hero-gold)" letter-spacing="1.2">FULL-STACK DEVELOPER</text>

    <!-- 3. Core Positioning -->
    <text x="44" y="174" class="font-mono" font-size="14.5" font-weight="700" fill="#E2E8F0" letter-spacing="1">MERN <tspan fill="#E5C07B">·</tspan> PYTHON <tspan fill="#E5C07B">·</tspan> DJANGO REST <tspan fill="#E5C07B">·</tspan> REACT NATIVE</text>

    <!-- 4. One-Line Positioning Statement -->
    <text x="44" y="210" class="font-sans" font-size="15" font-weight="500" fill="#94A3B8">Building modern web and mobile applications, REST APIs, AI-powered applications and production-ready software.</text>

    <!-- 5. Status Indicators -->
    <!-- Pill 1: Open to Roles -->
    <g transform="translate(44, 246)">
      <rect width="280" height="46" rx="23" fill="#0C1324" stroke="rgba(16,185,129,0.3)" stroke-width="1.2" />
      <!-- Pulsing Beacon -->
      <circle cx="24" cy="23" r="4.5" fill="#10B981" />
      <circle cx="24" cy="23" r="4.5" fill="#10B981" opacity="0.7" class="beacon-ring" />
      <text x="40" y="28" class="font-sans" font-size="14" font-weight="600" fill="#E6EDF3">Open to Full-Stack Roles</text>
    </g>

    <!-- Pill 2: Intern at Godavari Wave Technologies -->
    <g transform="translate(340, 246)">
      <rect width="490" height="46" rx="23" fill="#0C1324" stroke="rgba(229,192,123,0.3)" stroke-width="1.2" />
      <circle cx="24" cy="23" r="4.5" fill="#E5C07B" />
      <text x="40" y="28" class="font-sans" font-size="14" font-weight="600" fill="#E6EDF3">Full-Stack Developer Intern @ Godavari Wave Tech</text>
    </g>
  </g>
</svg>
