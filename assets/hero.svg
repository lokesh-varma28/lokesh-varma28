<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="340" fill="none">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#080C18" />
    </linearGradient>
    <linearGradient id="hero-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="hero-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <filter id="aurora-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" />
    </filter>
    <clipPath id="hero-clip">
      <rect width="900" height="340" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    @media (prefers-reduced-motion: no-preference) {
      .aurora-1 {
        animation: drift1 20s ease-in-out infinite alternate;
      }
      .aurora-2 {
        animation: drift2 24s ease-in-out infinite alternate;
      }
      .sheen-beam {
        animation: sheenSweep 8s ease-in-out infinite;
      }
      .beacon-ring {
        animation: pulseRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .role-1 { animation: cycle1 9s ease-in-out infinite; }
      .role-2 { animation: cycle2 9s ease-in-out infinite; }
      .role-3 { animation: cycle3 9s ease-in-out infinite; }
    }
    @keyframes drift1 {
      0% { transform: translate(0px, 0px); opacity: 0.22; }
      100% { transform: translate(140px, 40px); opacity: 0.35; }
    }
    @keyframes drift2 {
      0% { transform: translate(0px, 0px); opacity: 0.18; }
      100% { transform: translate(-120px, -30px); opacity: 0.3; }
    }
    @keyframes sheenSweep {
      0% { transform: translateX(-900px); }
      30%, 100% { transform: translateX(1100px); }
    }
    @keyframes pulseRing {
      0% { r: 5px; opacity: 0.9; }
      70% { r: 12px; opacity: 0; }
      100% { r: 12px; opacity: 0; }
    }
    @keyframes cycle1 {
      0%, 28% { opacity: 1; }
      33%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes cycle2 {
      0%, 28% { opacity: 0; }
      33%, 61% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes cycle3 {
      0%, 61% { opacity: 0; }
      66%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <!-- Opaque Rounded Dark Plate -->
  <g clip-path="url(#hero-clip)">
    <rect width="900" height="340" rx="16" fill="url(#hero-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

    <!-- Drifting Aurora Orbs -->
    <g filter="url(#aurora-blur)">
      <circle cx="160" cy="110" r="130" fill="#22D3EE" class="aurora-1" />
      <circle cx="740" cy="200" r="140" fill="#6366F1" class="aurora-2" />
    </g>

    <!-- Diagonal Sheen Light Sweep -->
    <rect x="-300" y="-100" width="220" height="540" fill="url(#hero-sheen)" transform="skewX(-25)" class="sheen-beam" pointer-events="none" />

    <!-- Name: Lokesh Varma -->
    <text x="44" y="74" class="font-sans" font-size="52" font-weight="800" fill="#E6EDF3" letter-spacing="0.5">Lokesh Varma</text>

    <!-- Animated Cycling Role Line (all text >= 28 units) -->
    <g transform="translate(44, 122)">
      <text class="font-sans role-1" font-size="30" font-weight="700" fill="url(#hero-accent)" letter-spacing="0.3">Full-Stack Developer</text>
      <text class="font-sans role-2" font-size="30" font-weight="700" fill="url(#hero-accent)" letter-spacing="0.3" opacity="0">React &amp; Node.js Engineer</text>
      <text class="font-sans role-3" font-size="30" font-weight="700" fill="url(#hero-accent)" letter-spacing="0.3" opacity="0">Django REST Framework Builder</text>
    </g>

    <!-- Value Prop (high contrast off-white, font-size >= 28 units) -->
    <text x="44" y="174" class="font-sans" font-size="28" font-weight="500" fill="#F1F5F9">I build full-stack web apps with React, Node.js &amp; Django REST,</text>
    <text x="44" y="214" class="font-sans" font-size="28" font-weight="500" fill="#F1F5F9">engineered end-to-end from database to cloud deployment.</text>

    <!-- Status Pills (all text >= 28 units) -->
    <!-- Pill 1: Open to Roles -->
    <g transform="translate(44, 258)">
      <rect width="360" height="54" rx="27" fill="#0F172A" stroke="rgba(34,211,238,0.25)" stroke-width="1.2" />
      <!-- Pulsing Beacon -->
      <circle cx="28" cy="27" r="5" fill="#10B981" />
      <circle cx="28" cy="27" r="5" fill="#10B981" opacity="0.7" class="beacon-ring" />
      <text x="48" y="37" class="font-sans" font-size="28" font-weight="600" fill="#E6EDF3">Open to full-stack roles</text>
    </g>

    <!-- Pill 2: Intern at Godavari Wave Technologies -->
    <g transform="translate(420, 258)">
      <rect width="440" height="54" rx="27" fill="#0F172A" stroke="rgba(99,102,241,0.25)" stroke-width="1.2" />
      <circle cx="28" cy="27" r="5" fill="#6366F1" />
      <text x="48" y="37" class="font-sans" font-size="28" font-weight="600" fill="#E6EDF3">Godavari Wave Tech Intern</text>
    </g>
  </g>
</svg>
