<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="100%" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="60%" stop-color="#0B1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Champagne Gold Accent Gradient -->
    <linearGradient id="hero-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <clipPath id="hero-clip">
      <rect width="640" height="260" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    @media (prefers-reduced-motion: no-preference) {
      .hero-text-reveal {
        animation: textReveal 0.8s ease-out forwards;
      }
      .beacon-ring {
        animation: pulseRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    }
    @keyframes textReveal {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseRing {
      0% { r: 5px; opacity: 0.9; }
      70% { r: 12px; opacity: 0; }
      100% { r: 12px; opacity: 0; }
    }
  </style>

  <!-- Opaque Rounded Dark Plate -->
  <g clip-path="url(#hero-clip)">
    <rect width="640" height="260" rx="16" fill="url(#hero-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- Subtle Top Edge Highlight -->
    <line x1="16" y1="1" x2="624" y2="1" stroke="rgba(229,192,123,0.3)" stroke-width="1" />

    <g class="hero-text-reveal">
      <!-- 0. Eyebrow Badge -->
      <text x="32" y="42" class="font-mono" font-size="22" font-weight="700" fill="#E5C07B" letter-spacing="1.5">FULL-STACK ARCHITECTURE &amp; ENGINEERING</text>

      <!-- 1. Name (Heading >= 36) -->
      <text x="32" y="94" class="font-sans" font-size="46" font-weight="900" fill="#F8FAFC" letter-spacing="0.5">LOKESH VARMA</text>

      <!-- 2. Primary Identity (Body >= 24) -->
      <text x="32" y="136" class="font-sans" font-size="26" font-weight="800" fill="url(#hero-gold)" letter-spacing="1">FULL-STACK DEVELOPER</text>

      <!-- 3. Core Positioning Tags (>= 22) -->
      <text x="32" y="172" class="font-mono" font-size="22" font-weight="600" fill="#94A3B8">MERN <tspan fill="#E5C07B">·</tspan> Python <tspan fill="#E5C07B">·</tspan> Django REST <tspan fill="#E5C07B">·</tspan> React Native</text>

      <!-- 4. Status Indicator Pill -->
      <g transform="translate(32, 196)">
        <rect width="576" height="44" rx="22" fill="#0C1324" stroke="rgba(16,185,129,0.35)" stroke-width="1.2" />
        <!-- Pulsing Beacon -->
        <circle cx="22" cy="22" r="5" fill="#10B981" />
        <circle cx="22" cy="22" r="5" fill="#10B981" opacity="0.7" class="beacon-ring" />
        <text x="40" y="29" class="font-sans" font-size="22" font-weight="600" fill="#E6EDF3">Open to Roles <tspan fill="#64748B">·</tspan> Intern @ Godavari Wave Tech</text>
      </g>
    </g>
  </g>
</svg>
