<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 44" width="440" height="44" fill="none">
  <defs>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <clipPath id="track-clip">
      <rect x="0" y="38" width="390" height="3" rx="1.5" />
    </clipPath>
  </defs>
  <style>
    .header-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#text-grad);
    }
    .track-bg { fill: #1E293B; opacity: 0.6; }
    @media (prefers-color-scheme: light) {
      .track-bg { fill: #E2E8F0; opacity: 0.9; }
    }
  </style>

  <!-- Left Indicator Bar -->
  <rect x="0" y="6" width="4" height="22" rx="2" fill="url(#pill-grad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" />
  </rect>

  <!-- Title Text -->
  <text x="14" y="24" class="header-text">05 — CERTIFICATIONS</text>

  <!-- Animated Underline Track & Shimmer -->
  <rect x="0" y="38" width="390" height="3" rx="1.5" class="track-bg" />
  <g clip-path="url(#track-clip)">
    <rect x="-140" y="38" width="140" height="3" rx="1.5" fill="url(#shimmer-grad)">
      <animate attributeName="x" from="-140" to="390" dur="2.8s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
