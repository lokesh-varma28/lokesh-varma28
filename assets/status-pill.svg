<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 32" width="380" height="32" fill="none">
  <defs>
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="pill-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5" />
    </linearGradient>
  </defs>
  <style>
    .pill-container { fill: url(#pill-bg); stroke: url(#pill-stroke); stroke-width: 1.2; rx: 16px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #94A3B8; text-transform: uppercase; }
    .company { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #F8FAFC; }
    @media (prefers-color-scheme: light) {
      .pill-container { fill: #F8FAFC; stroke: #CBD5E1; }
      .label { fill: #64748B; }
      .company { fill: #0F172A; }
    }
  </style>

  <rect width="380" height="32" class="pill-container" />

  <!-- Animated pulsing radar beacon -->
  <g transform="translate(18, 16)">
    <circle cx="0" cy="0" r="4" fill="#10B981" />
    <circle cx="0" cy="0" r="4" fill="#10B981" opacity="0.8">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="32" y="20" class="label">CURRENTLY WORKING</text>
  <text x="160" y="20" fill="#64748B" font-size="11">·</text>
  <text x="172" y="20" class="company">Godavari Wave Technologies</text>
</svg>
