<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E5C07B" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#E5C07B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12" />
    </linearGradient>
    <clipPath id="footer-clip">
      <rect width="900" height="80" rx="14" />
    </clipPath>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wave-1 {
        animation: waveDrift1 14s ease-in-out infinite alternate;
      }
      .wave-2 {
        animation: waveDrift2 18s ease-in-out infinite alternate;
      }
    }
    @keyframes waveDrift1 {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(-6px) scaleY(1.12); }
    }
    @keyframes waveDrift2 {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(6px) scaleY(0.92); }
    }
  </style>

  <g clip-path="url(#footer-clip)">
    <rect width="900" height="80" rx="14" fill="#080C16" stroke="rgba(255,255,255,0.06)" />

    <!-- Wave Layer 1 -->
    <path class="wave-1" d="M 0 42 Q 225 18, 450 42 T 900 42 L 900 80 L 0 80 Z" fill="url(#wave-grad-1)" />

    <!-- Wave Layer 2 -->
    <path class="wave-2" d="M 0 52 Q 225 64, 450 52 T 900 52 L 900 80 L 0 80 Z" fill="url(#wave-grad-2)" />
  </g>
</svg>
