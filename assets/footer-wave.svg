<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 60" width="100%" fill="none">
  <defs>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E5C07B" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#E5C07B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12" />
    </linearGradient>
    <clipPath id="footer-clip">
      <rect width="640" height="60" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#footer-clip)">
    <rect width="640" height="60" rx="14" fill="#080C16" stroke="rgba(255,255,255,0.06)" />
    <!-- Wave Layer 1 -->
    <path d="M 0 32 Q 160 14, 320 32 T 640 32 L 640 60 L 0 60 Z" fill="url(#wave-grad-1)" />
    <!-- Wave Layer 2 -->
    <path d="M 0 40 Q 160 48, 320 40 T 640 40 L 640 60 L 0 60 Z" fill="url(#wave-grad-2)" />
  </g>
</svg>
