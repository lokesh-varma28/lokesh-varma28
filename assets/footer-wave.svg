<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90" fill="none">
  <defs>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>
    <clipPath id="footer-clip">
      <rect width="900" height="90" rx="16" />
    </clipPath>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wave-1 {
        animation: waveDrift1 12s ease-in-out infinite alternate;
      }
      .wave-2 {
        animation: waveDrift2 16s ease-in-out infinite alternate;
      }
    }
    @keyframes waveDrift1 {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(-8px) scaleY(1.15); }
    }
    @keyframes waveDrift2 {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(8px) scaleY(0.9); }
    }
  </style>

  <g clip-path="url(#footer-clip)">
    <rect width="900" height="90" rx="16" fill="#0B1020" stroke="rgba(255,255,255,0.06)" />

    <!-- Wave Layer 1 -->
    <path class="wave-1" d="M 0 50 Q 225 20, 450 50 T 900 50 L 900 90 L 0 90 Z" fill="url(#wave-grad-1)" />

    <!-- Wave Layer 2 -->
    <path class="wave-2" d="M 0 60 Q 225 75, 450 60 T 900 60 L 900 90 L 0 90 Z" fill="url(#wave-grad-2)" />
  </g>
</svg>
