<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="100%" fill="none">
  <defs>
    <!-- Wave Gradient 1: Electric Cyan Accent -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.18;0.36;0.18" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Wave Gradient 2: Subtle Deep Sky & Gold Horizon -->
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#E5C07B" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.12;0.26;0.12" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.08" />
    </linearGradient>

    <clipPath id="footer-clip">
      <rect width="850" height="64" rx="14" />
    </clipPath>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wave-slow {
        animation: waveDrift 7s ease-in-out infinite alternate;
      }
      .wave-fast {
        animation: waveDrift 5s ease-in-out infinite alternate-reverse;
      }
    }
    @keyframes waveDrift {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(-4px) scaleY(1.05); }
    }
  </style>

  <g clip-path="url(#footer-clip)">
    <!-- Dark Obsidian Base Plate -->
    <rect width="850" height="64" rx="14" fill="#060913" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" />

    <!-- Ambient Grid Accent Hairline -->
    <line x1="24" y1="1" x2="826" y2="1" stroke="rgba(0, 240, 255, 0.22)" stroke-width="1" />

    <!-- Wave Layer 1: Ambient Horizon Flow -->
    <path class="wave-slow" d="M -20 34 Q 212 16, 425 34 T 870 34 L 870 64 L -20 64 Z" fill="url(#wave-grad-2)" />

    <!-- Wave Layer 2: Electric Cyan Surface Swell -->
    <path class="wave-fast" d="M -20 42 Q 212 50, 425 42 T 870 42 L 870 64 L -20 64 Z" fill="url(#wave-grad-1)" />
  </g>
</svg>