<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" fill="none">
  <defs>
    <linearGradient id="sec-base-gh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#162036" stop-opacity="0" />
      <stop offset="30%" stop-color="#1E2A47" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#28385E" stop-opacity="1" />
      <stop offset="70%" stop-color="#1E2A47" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#162036" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sec-accent-gh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <style>
    .header-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
  </style>

  <!-- Centered Section Title -->
  <text x="425" y="25" text-anchor="middle" class="header-text">
    <tspan fill="#00F0FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">05 // </tspan>
    <tspan fill="#F8FAFC" font-size="17" font-weight="800" letter-spacing="2">GITHUB ACTIVITY</tspan>
  </text>

  <!-- Horizontal Hairline Base Line -->
  <line x1="120" y1="41" x2="730" y2="41" stroke="url(#sec-base-gh)" stroke-width="1.2" />

  <!-- Center Active Accent Pip & Bar -->
  <rect x="395" y="40" width="60" height="2" rx="1" fill="url(#sec-accent-gh)" />
  <circle cx="425" cy="41" r="2.5" fill="#00F0FF" />
</svg>