<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="100%" height="16" fill="none">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>

  <style>
    .track-line {
      stroke: #1E2640;
      stroke-width: 2;
    }
    @media (prefers-reduced-motion: no-preference) {
      .travel-dot {
        animation: dotTravel 6s ease-in-out infinite;
      }
    }
    @keyframes dotTravel {
      0% { transform: translateX(40px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(860px); opacity: 0; }
    }
  </style>

  <!-- Base track line -->
  <line x1="40" y1="8" x2="860" y2="8" class="track-line" />
  <line x1="40" y1="8" x2="860" y2="8" stroke="url(#div-grad)" stroke-width="2" />

  <!-- Travelling Dot (6s loop) -->
  <g class="travel-dot">
    <circle cx="0" cy="8" r="4.5" fill="#22D3EE" filter="url(#dot-glow)" />
    <circle cx="0" cy="8" r="3" fill="#FFFFFF" />
  </g>
</svg>
