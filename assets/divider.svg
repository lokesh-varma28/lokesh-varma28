<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 18" width="100%" fill="none">
  <defs>
    <!-- Base Hairline Gradient: Visible Cyan-to-Dark Sweep -->
    <linearGradient id="div-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Smooth Traveling Shimmer Sweep -->
    <linearGradient id="div-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0">
        <animate attributeName="offset" values="-0.4; 1.0" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="15%" stop-color="#00F0FF" stop-opacity="0.9">
        <animate attributeName="offset" values="-0.25; 1.15" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0">
        <animate attributeName="offset" values="-0.1; 1.3" dur="4.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="div-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .center-jewel {
        animation: pulseJewel 3s ease-in-out infinite;
      }
    }
    @keyframes pulseJewel {
      0%, 100% { opacity: 0.75; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- 1. Refined Cyan Hairline Base -->
  <line x1="40" y1="9" x2="810" y2="9" stroke="url(#div-base)" stroke-width="1.2" />

  <!-- 2. Smooth Traveling Cyan Light Sweep -->
  <line x1="50" y1="9" x2="800" y2="9" stroke="url(#div-shimmer)" stroke-width="1.4" filter="url(#div-glow)" />

  <!-- 3. Ambient Center Diamond Accents (Exactly Centered at x=425) -->
  <g transform="translate(425, 9)">
    <circle cx="0" cy="0" r="2.5" fill="#00F0FF" class="center-jewel" />
    <circle cx="-16" cy="0" r="1.3" fill="#38BDF8" opacity="0.75" />
    <circle cx="16" cy="0" r="1.3" fill="#38BDF8" opacity="0.75" />
    <circle cx="-32" cy="0" r="0.9" fill="#00F0FF" opacity="0.5" />
    <circle cx="32" cy="0" r="0.9" fill="#00F0FF" opacity="0.5" />
  </g>
</svg>