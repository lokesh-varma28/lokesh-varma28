<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="100%" height="6" fill="none">
  <defs>
    <linearGradient id="div-static" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="div-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <clipPath id="div-clip">
      <rect x="0" y="2" width="800" height="2" rx="1" />
    </clipPath>
  </defs>
  <style>
    .div-base { fill: #1E293B; opacity: 0.5; }
    @media (prefers-color-scheme: light) {
      .div-base { fill: #E2E8F0; opacity: 0.8; }
    }
  </style>

  <rect x="0" y="2" width="800" height="2" rx="1" class="div-base" />
  <rect x="0" y="2" width="800" height="2" rx="1" fill="url(#div-static)" />
  <g clip-path="url(#div-clip)">
    <rect x="-240" y="1" width="240" height="4" rx="2" fill="url(#div-beam)">
      <animate attributeName="x" from="-240" to="800" dur="3.5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
