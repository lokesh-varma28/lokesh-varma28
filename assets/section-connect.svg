<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 38" width="340" height="38" fill="none">
  <defs>
    <linearGradient id="gold-bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <style>
    .header-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
    }
  </style>

  <!-- Left Indicator Bar in Champagne Gold -->
  <rect x="0" y="4" width="4" height="22" rx="2" fill="url(#gold-bar)" />

  <!-- Section Title -->
  <text x="14" y="22" class="header-text">
    <tspan fill="#E5C07B">07 — </tspan>
    <tspan fill="#F8FAFC">CONNECT</tspan>
  </text>

  <!-- Subtle Underline Track -->
  <rect x="0" y="34" width="300" height="2" rx="1" fill="#1A2338" />
  <rect x="0" y="34" width="50" height="2" rx="1" fill="#E5C07B" opacity="0.8" />
</svg>
