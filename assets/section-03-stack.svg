<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 50" width="480" height="50" fill="none">
  <defs>
    <linearGradient id="sec-text-grad-section-03-stack.svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="sec-glow-section-03-stack.svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <clipPath id="sec-track-clip-section-03-stack.svg">
      <rect x="0" y="42" width="420" height="4" rx="2" />
    </clipPath>
  </defs>

  <style>
    .header-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#sec-text-grad-section-03-stack.svg);
    }
    @media (prefers-reduced-motion: no-preference) {
      .travel-glow {
        animation: glowLoop 6s ease-in-out infinite;
      }
      .indicator-pulse {
        animation: indPulse 3s ease-in-out infinite;
      }
    }
    @keyframes glowLoop {
      0% { transform: translateX(-160px); }
      50%, 100% { transform: translateX(460px); }
    }
    @keyframes indPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Left Accent Indicator -->
  <rect x="0" y="8" width="5" height="26" rx="2.5" fill="#22D3EE" class="indicator-pulse" />

  <!-- Title Text (>= 28 units) -->
  <text x="18" y="30" class="header-text">03 — TECHNICAL STACK</text>

  <!-- Underline Track & Travelling Glow (6s loop) -->
  <rect x="0" y="42" width="420" height="4" rx="2" fill="#1E2640" opacity="0.6" />
  <g clip-path="url(#sec-track-clip-section-03-stack.svg)">
    <rect x="-140" y="42" width="140" height="4" rx="2" fill="url(#sec-glow-section-03-stack.svg)" class="travel-glow" />
  </g>
</svg>
