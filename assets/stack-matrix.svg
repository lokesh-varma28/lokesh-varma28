<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="100%" height="410" fill="none">
  <defs>
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#080C18" />
    </linearGradient>
    <linearGradient id="sm-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <clipPath id="sm-clip">
      <rect width="900" height="410" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    .cat-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      fill: #22D3EE;
    }
    .tech-pill {
      fill: #0E162D;
      stroke: rgba(255,255,255,0.09);
      stroke-width: 1.2;
      rx: 8px;
    }
    .tech-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 28px;
      font-weight: 600;
      fill: #E6EDF3;
    }
  </style>

  <g clip-path="url(#sm-clip)">
    <!-- Base Plate -->
    <rect width="900" height="410" rx="16" fill="url(#sm-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

    <!-- ROW 1: LANGUAGES (y = 52) -->
    <g transform="translate(32, 24)">
      <text x="0" y="38" class="cat-title">LANGUAGES</text>
      <!-- JavaScript -->
      <g transform="translate(225, 0)">
        <rect width="70" height="52" class="tech-pill" />
        <text x="14" y="36" class="tech-name">JS</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(305, 0)">
        <rect width="70" height="52" class="tech-pill" />
        <text x="15" y="36" class="tech-name">TS</text>
      </g>
      <!-- Python -->
      <g transform="translate(385, 0)">
        <rect width="115" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Python</text>
      </g>
      <!-- HTML5 -->
      <g transform="translate(510, 0)">
        <rect width="110" height="52" class="tech-pill" />
        <text x="15" y="36" class="tech-name">HTML5</text>
      </g>
      <!-- CSS3 -->
      <g transform="translate(630, 0)">
        <rect width="95" height="52" class="tech-pill" />
        <text x="15" y="36" class="tech-name">CSS3</text>
      </g>
    </g>

    <line x1="32" y1="94" x2="868" y2="94" stroke="rgba(255,255,255,0.05)" />

    <!-- ROW 2: FRONTEND (y = 104) -->
    <g transform="translate(32, 102)">
      <text x="0" y="38" class="cat-title">FRONTEND</text>
      <!-- React -->
      <g transform="translate(225, 0)">
        <rect width="105" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">React</text>
      </g>
      <!-- Tailwind CSS -->
      <g transform="translate(340, 0)">
        <rect width="180" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Tailwind CSS</text>
      </g>
      <!-- Redux -->
      <g transform="translate(530, 0)">
        <rect width="110" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Redux</text>
      </g>
      <!-- Zustand -->
      <g transform="translate(650, 0)">
        <rect width="130" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Zustand</text>
      </g>
    </g>

    <line x1="32" y1="172" x2="868" y2="172" stroke="rgba(255,255,255,0.05)" />

    <!-- ROW 3: BACKEND (y = 182) -->
    <g transform="translate(32, 180)">
      <text x="0" y="38" class="cat-title">BACKEND</text>
      <!-- Django REST -->
      <g transform="translate(225, 0)">
        <rect width="195" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Django REST</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(430, 0)">
        <rect width="130" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Node.js</text>
      </g>
      <!-- Express -->
      <g transform="translate(570, 0)">
        <rect width="135" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Express</text>
      </g>
      <!-- REST APIs -->
      <g transform="translate(715, 0)">
        <rect width="120" height="52" class="tech-pill" />
        <text x="14" y="36" class="tech-name">REST</text>
      </g>
    </g>

    <line x1="32" y1="250" x2="868" y2="250" stroke="rgba(255,255,255,0.05)" />

    <!-- ROW 4: DATA & CLOUD (y = 260) -->
    <g transform="translate(32, 258)">
      <text x="0" y="38" class="cat-title">DATA &amp; CLOUD</text>
      <!-- PostgreSQL -->
      <g transform="translate(225, 0)">
        <rect width="175" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">PostgreSQL</text>
      </g>
      <!-- MongoDB -->
      <g transform="translate(410, 0)">
        <rect width="150" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">MongoDB</text>
      </g>
      <!-- Supabase -->
      <g transform="translate(570, 0)">
        <rect width="150" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Supabase</text>
      </g>
      <!-- Vercel -->
      <g transform="translate(730, 0)">
        <rect width="110" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Vercel</text>
      </g>
    </g>

    <line x1="32" y1="328" x2="868" y2="328" stroke="rgba(255,255,255,0.05)" />

    <!-- ROW 5: TOOLS (y = 338) -->
    <g transform="translate(32, 336)">
      <text x="0" y="38" class="cat-title">TOOLS</text>
      <!-- Postman -->
      <g transform="translate(225, 0)">
        <rect width="145" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Postman</text>
      </g>
      <!-- Git -->
      <g transform="translate(380, 0)">
        <rect width="75" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">Git</text>
      </g>
      <!-- GitHub -->
      <g transform="translate(465, 0)">
        <rect width="125" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">GitHub</text>
      </g>
      <!-- VS Code -->
      <g transform="translate(600, 0)">
        <rect width="145" height="52" class="tech-pill" />
        <text x="16" y="36" class="tech-name">VS Code</text>
      </g>
    </g>
  </g>
</svg>
