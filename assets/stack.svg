<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0B1124" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Header Gold Gradient -->
    <linearGradient id="stack-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <clipPath id="stack-clip">
      <rect width="640" height="460" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    .sec-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
      fill: #22D3EE;
    }
    .chip-plate {
      fill: #0C1222;
      stroke: rgba(255, 255, 255, 0.09);
      stroke-width: 1.2px;
      rx: 8px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      fill: #E6EDF3;
    }
    .chip-accent {
      stroke: rgba(229, 192, 123, 0.35);
    }
  </style>

  <g clip-path="url(#stack-clip)">
    <!-- Base Plate -->
    <rect width="640" height="460" rx="16" fill="url(#stack-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- 0. Header Bar -->
    <text x="24" y="36" class="font-mono" font-size="14" font-weight="700" fill="url(#stack-gold)" letter-spacing="1">FULL-STACK TECHNOLOGY MATRIX</text>
    <line x1="24" y1="48" x2="616" y2="48" stroke="rgba(255,255,255,0.07)" stroke-width="1" />

    <!-- ROW 1: FRONTEND & STATE MANAGEMENT -->
    <text x="24" y="80" class="sec-label">FRONTEND &amp; STATE MANAGEMENT</text>
    <g transform="translate(24, 92)">
      <!-- React -->
      <rect width="92" height="40" class="chip-plate chip-accent" />
      <text x="46" y="25" text-anchor="middle" class="chip-text">React</text>
      <!-- JavaScript -->
      <rect x="100" width="130" height="40" class="chip-plate chip-accent" />
      <text x="165" y="25" text-anchor="middle" class="chip-text">JavaScript</text>
      <!-- Tailwind CSS -->
      <rect x="238" width="144" height="40" class="chip-plate" />
      <text x="310" y="25" text-anchor="middle" class="chip-text">Tailwind CSS</text>
      <!-- Redux -->
      <rect x="390" width="96" height="40" class="chip-plate" />
      <text x="438" y="25" text-anchor="middle" class="chip-text">Redux</text>
      <!-- Zustand -->
      <rect x="494" width="98" height="40" class="chip-plate" />
      <text x="543" y="25" text-anchor="middle" class="chip-text">Zustand</text>
    </g>

    <line x1="24" y1="148" x2="616" y2="148" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- ROW 2: BACKEND & APIS -->
    <text x="24" y="178" class="sec-label">BACKEND &amp; APIS</text>
    <g transform="translate(24, 190)">
      <!-- Python -->
      <rect width="100" height="40" class="chip-plate chip-accent" />
      <text x="50" y="25" text-anchor="middle" class="chip-text">Python</text>
      <!-- Django REST -->
      <rect x="108" width="148" height="40" class="chip-plate chip-accent" />
      <text x="182" y="25" text-anchor="middle" class="chip-text">Django REST</text>
      <!-- Node.js -->
      <rect x="264" width="108" height="40" class="chip-plate chip-accent" />
      <text x="318" y="25" text-anchor="middle" class="chip-text">Node.js</text>
      <!-- Express.js -->
      <rect x="380" width="114" height="40" class="chip-plate" />
      <text x="437" y="25" text-anchor="middle" class="chip-text">Express.js</text>
      <!-- REST APIs -->
      <rect x="502" width="90" height="40" class="chip-plate" />
      <text x="547" y="25" text-anchor="middle" class="chip-text">REST APIs</text>
    </g>

    <line x1="24" y1="246" x2="616" y2="246" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- ROW 3: DATABASES, CLOUD & MOBILE -->
    <text x="24" y="276" class="sec-label">DATABASES, CLOUD &amp; MOBILE</text>
    <g transform="translate(24, 288)">
      <!-- PostgreSQL -->
      <rect width="128" height="40" class="chip-plate" />
      <text x="64" y="25" text-anchor="middle" class="chip-text">PostgreSQL</text>
      <!-- MongoDB -->
      <rect x="136" width="112" height="40" class="chip-plate" />
      <text x="192" y="25" text-anchor="middle" class="chip-text">MongoDB</text>
      <!-- React Native -->
      <rect x="256" width="138" height="40" class="chip-plate chip-accent" />
      <text x="325" y="25" text-anchor="middle" class="chip-text">React Native</text>
      <!-- TypeScript -->
      <rect x="402" width="118" height="40" class="chip-plate" />
      <text x="461" y="25" text-anchor="middle" class="chip-text">TypeScript</text>
      <!-- Vercel -->
      <rect x="528" width="64" height="40" class="chip-plate" />
      <text x="560" y="25" text-anchor="middle" class="chip-text">Vercel</text>
    </g>

    <line x1="24" y1="344" x2="616" y2="344" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- ROW 4: TESTING & AI INTEGRATION -->
    <text x="24" y="374" class="sec-label">TESTING &amp; AI INTEGRATION</text>
    <g transform="translate(24, 386)">
      <!-- Playwright -->
      <rect width="120" height="40" class="chip-plate" />
      <text x="60" y="25" text-anchor="middle" class="chip-text">Playwright</text>
      <!-- Jest / Tests -->
      <rect x="128" width="134" height="40" class="chip-plate" />
      <text x="195" y="25" text-anchor="middle" class="chip-text">Jest Tests</text>
      <!-- Postman -->
      <rect x="270" width="104" height="40" class="chip-plate" />
      <text x="322" y="25" text-anchor="middle" class="chip-text">Postman</text>
      <!-- Bruno -->
      <rect x="382" width="86" height="40" class="chip-plate" />
      <text x="425" y="25" text-anchor="middle" class="chip-text">Bruno</text>
      <!-- Gemini API -->
      <rect x="476" width="116" height="40" class="chip-plate chip-accent" />
      <text x="534" y="25" text-anchor="middle" class="chip-text">Gemini API</text>
    </g>
  </g>
</svg>
