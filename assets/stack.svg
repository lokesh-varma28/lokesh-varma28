<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="60%" stop-color="#0E162D" />
      <stop offset="100%" stop-color="#080C18" />
    </linearGradient>

    <!-- Clip Path -->
    <clipPath id="stack-clip">
      <rect width="640" height="470" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    .sec-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.8px;
      fill: #22D3EE;
    }
    .chip-plate {
      fill: #0E162D;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1.2px;
      rx: 8px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 24px;
      font-weight: 600;
      fill: #E6EDF3;
    }
  </style>

  <g clip-path="url(#stack-clip)">
    <!-- Base Plate -->
    <rect width="640" height="470" rx="16" fill="url(#stack-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- 0. Header Bar -->
    <text x="24" y="38" class="font-mono" font-size="22" font-weight="700" fill="#E5C07B" letter-spacing="1">FULL-STACK TECHNOLOGY MATRIX</text>
    <line x1="24" y1="52" x2="616" y2="52" stroke="rgba(255,255,255,0.07)" stroke-width="1" />

    <!-- ROW 1: FRONTEND & MOBILE -->
    <text x="24" y="86" class="sec-label">FRONTEND &amp; MOBILE</text>
    <g transform="translate(24, 98)">
      <!-- React -->
      <rect width="100" height="44" class="chip-plate" />
      <text x="50" y="30" text-anchor="middle" class="chip-text">React</text>
      <!-- TypeScript -->
      <rect x="112" width="160" height="44" class="chip-plate" />
      <text x="192" y="30" text-anchor="middle" class="chip-text">TypeScript</text>
      <!-- Tailwind CSS -->
      <rect x="284" width="140" height="44" class="chip-plate" />
      <text x="354" y="30" text-anchor="middle" class="chip-text">Tailwind</text>
      <!-- React Native -->
      <rect x="436" width="180" height="44" class="chip-plate" />
      <text x="526" y="30" text-anchor="middle" class="chip-text">React Native</text>
    </g>

    <line x1="24" y1="156" x2="616" y2="156" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- ROW 2: BACKEND & APIS -->
    <text x="24" y="188" class="sec-label">BACKEND &amp; APIS</text>
    <g transform="translate(24, 200)">
      <!-- Node.js -->
      <rect width="120" height="44" class="chip-plate" />
      <text x="60" y="30" text-anchor="middle" class="chip-text">Node.js</text>
      <!-- Express -->
      <rect x="132" width="125" height="44" class="chip-plate" />
      <text x="194" y="30" text-anchor="middle" class="chip-text">Express</text>
      <!-- Django REST -->
      <rect x="269" width="180" height="44" class="chip-plate" />
      <text x="359" y="30" text-anchor="middle" class="chip-text">Django REST</text>
      <!-- Python -->
      <rect x="461" width="155" height="44" class="chip-plate" />
      <text x="538" y="30" text-anchor="middle" class="chip-text">Python</text>
    </g>

    <line x1="24" y1="258" x2="616" y2="258" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- ROW 3: DATABASES & CLOUD -->
    <text x="24" y="290" class="sec-label">DATABASES &amp; CLOUD</text>
    <g transform="translate(24, 302)">
      <!-- PostgreSQL -->
      <rect width="165" height="44" class="chip-plate" />
      <text x="82" y="30" text-anchor="middle" class="chip-text">PostgreSQL</text>
      <!-- MongoDB -->
      <rect x="177" width="145" height="44" class="chip-plate" />
      <text x="249" y="30" text-anchor="middle" class="chip-text">MongoDB</text>
      <!-- Vercel -->
      <rect x="334" width="120" height="44" class="chip-plate" />
      <text x="394" y="30" text-anchor="middle" class="chip-text">Vercel</text>
      <!-- Render -->
      <rect x="466" width="150" height="44" class="chip-plate" />
      <text x="541" y="30" text-anchor="middle" class="chip-text">Render</text>
    </g>

    <line x1="24" y1="360" x2="616" y2="360" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- ROW 4: TESTING & AI INTEGRATION -->
    <text x="24" y="392" class="sec-label">TESTING &amp; AI INTEGRATION</text>
    <g transform="translate(24, 404)">
      <!-- Postman -->
      <rect width="130" height="44" class="chip-plate" />
      <text x="65" y="30" text-anchor="middle" class="chip-text">Postman</text>
      <!-- Bruno -->
      <rect x="142" width="115" height="44" class="chip-plate" />
      <text x="199" y="30" text-anchor="middle" class="chip-text">Bruno</text>
      <!-- Playwright -->
      <rect x="269" width="165" height="44" class="chip-plate" />
      <text x="351" y="30" text-anchor="middle" class="chip-text">Playwright</text>
      <!-- Gemini API -->
      <rect x="446" width="170" height="44" class="chip-plate" />
      <text x="531" y="30" text-anchor="middle" class="chip-text">Gemini API</text>
    </g>
  </g>
</svg>
