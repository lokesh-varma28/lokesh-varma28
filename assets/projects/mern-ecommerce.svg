<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" fill="none">
  <defs>
    <linearGradient id="bg-mern-ec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>
    <linearGradient id="border-mern-ec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6" />
    </linearGradient>
    <clipPath id="clip-mern-ec">
      <rect width="640" height="360" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
  </style>

  <g clip-path="url(#clip-mern-ec)">
    <!-- Base Plate -->
    <rect width="640" height="360" rx="16" fill="url(#bg-mern-ec)" stroke="url(#border-mern-ec)" stroke-width="2" />

    <!-- Window Header Bar -->
    <rect width="640" height="52" fill="#090E1D" />
    <circle cx="32" cy="26" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="50" cy="26" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="68" cy="26" r="6" fill="#10B981" opacity="0.8" />
    <rect x="95" y="12" width="290" height="28" rx="6" fill="#0B1020" />
    <text x="110" y="32" class="font-mono" font-size="22" fill="#8B98A9">store.lokesh-varma.dev</text>

    <!-- Eyebrow Badge -->
    <rect x="32" y="74" width="345" height="34" rx="8" fill="#0E162D" stroke="#6366F1" stroke-width="1.2" />
    <text x="46" y="98" class="font-mono" font-size="22" font-weight="700" fill="#818CF8" letter-spacing="1">MULTI-TIER COMMERCE SYSTEM</text>

    <!-- Main Title -->
    <text x="32" y="152" class="font-sans" font-size="38" font-weight="900" fill="#F8FAFC">MERN E-Commerce Platform</text>

    <!-- Subtitle -->
    <text x="32" y="196" class="font-sans" font-size="24" font-weight="500" fill="#94A3B8">Decoupled Storefront &amp; Merchant Dashboard</text>

    <!-- Tech Chips (Max 3) -->
    <g transform="translate(32, 226)">
      <rect width="115" height="44" rx="8" fill="#0E162D" stroke="rgba(99,102,241,0.4)" stroke-width="1.2" />
      <text x="57" y="30" text-anchor="middle" class="font-mono" font-size="24" font-weight="700" fill="#818CF8">React</text>

      <rect x="130" width="205" height="44" rx="8" fill="#0E162D" stroke="rgba(34,211,238,0.4)" stroke-width="1.2" />
      <text x="232" y="30" text-anchor="middle" class="font-mono" font-size="24" font-weight="700" fill="#22D3EE">Node · Express</text>

      <rect x="350" width="150" height="44" rx="8" fill="#0E162D" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
      <text x="425" y="30" text-anchor="middle" class="font-mono" font-size="24" font-weight="700" fill="#E6EDF3">Razorpay</text>
    </g>

    <!-- Status Bar -->
    <rect x="32" y="294" width="576" height="42" rx="8" fill="#090E1D" stroke="rgba(255,255,255,0.06)" />
    <circle cx="52" cy="315" r="5" fill="#10B981" />
    <text x="68" y="322" class="font-mono" font-size="22" fill="#8B98A9">Live Store · Google OAuth · PDF Invoices</text>
  </g>
</svg>
