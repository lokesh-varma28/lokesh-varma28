<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="bg-ai-chatbot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>
    <linearGradient id="border-ai-chatbot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glow-ai-chatbot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-ai-chatbot" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <clipPath id="clip-ai-chatbot">
      <rect width="1200" height="630" rx="20" />
    </clipPath>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    @media (prefers-reduced-motion: no-preference) {
      .pulse-ring {
        animation: pulseRing 6s ease-in-out infinite;
      }
      .shimmer-line {
        animation: shimmerLine 8s ease-in-out infinite;
      }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    @keyframes shimmerLine {
      0% { transform: translateX(-1200px); }
      40%, 100% { transform: translateX(1200px); }
    }
  </style>

  <g clip-path="url(#clip-ai-chatbot)">
    <!-- Plate Base -->
    <rect width="1200" height="630" rx="20" fill="url(#bg-ai-chatbot)" stroke="url(#border-ai-chatbot)" stroke-width="2" />
    <rect width="1200" height="630" fill="url(#grid-ai-chatbot)" />

    <!-- Ambient Glow Top-Left -->
    <circle cx="150" cy="120" r="260" fill="url(#glow-ai-chatbot)" class="pulse-ring" />

    <!-- Browser Frame UI Mockup -->
    <g transform="translate(100, 75)">
      <!-- Window container -->
      <rect width="1000" height="480" rx="14" fill="#0E162D" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
      
      <!-- Window header bar -->
      <rect width="1000" height="48" rx="14" fill="#090E1D" />
      <circle cx="30" cy="24" r="6" fill="#EF4444" opacity="0.8" />
      <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8" />
      <circle cx="66" cy="24" r="6" fill="#10B981" opacity="0.8" />
      <rect x="110" y="12" width="400" height="24" rx="6" fill="#0B1020" />
      <text x="130" y="28" class="font-mono" font-size="13" fill="#8B98A9">lokesh-varma28.github.io/projects/ai-chatbot</text>

      <!-- Center Project Blueprint Badge -->
      <g transform="translate(60, 95)">
        <rect width="250" height="34" rx="8" fill="#0B1020" stroke="#22D3EE" stroke-width="1.2" />
        <text x="16" y="22" class="font-mono" font-size="13" font-weight="700" fill="#22D3EE" letter-spacing="1">FULL-STACK GEMINI PLATFORM</text>
        
        <text x="0" y="85" class="font-sans" font-size="44" font-weight="800" fill="#E6EDF3">AI Chatbot Assistant</text>
        <text x="0" y="125" class="font-sans" font-size="22" font-weight="500" fill="#8B98A9">Contextual LLM Application · PDF Document Intelligence</text>
        
        <!-- Blueprint Chip Badges -->
        <g transform="translate(0, 160)">
          <rect width="150" height="40" rx="8" fill="#0B1020" stroke="rgba(34,211,238,0.3)" />
          <text x="75" y="25" text-anchor="middle" class="font-mono" font-size="15" font-weight="600" fill="#22D3EE">React 19</text>

          <rect x="170" width="180" height="40" rx="8" fill="#0B1020" stroke="rgba(99,102,241,0.3)" />
          <text x="260" y="25" text-anchor="middle" class="font-mono" font-size="15" font-weight="600" fill="#818CF8">Gemini API</text>

          <rect x="370" width="160" height="40" rx="8" fill="#0B1020" stroke="rgba(255,255,255,0.12)" />
          <text x="450" y="25" text-anchor="middle" class="font-mono" font-size="15" font-weight="600" fill="#E6EDF3">MongoDB</text>
        </g>

        <!-- Status strip -->
        <g transform="translate(0, 230)">
          <rect width="880" height="60" rx="10" fill="#090E1D" stroke="rgba(255,255,255,0.06)" />
          <circle cx="30" cy="30" r="5" fill="#10B981" />
          <text x="50" y="36" class="font-mono" font-size="14" fill="#8B98A9">Architecture Verified · Production Deployed · 100% Functional Contract</text>
        </g>
      </g>
    </g>

    <!-- Subtle Shimmer Line -->
    <rect x="-600" y="0" width="300" height="630" fill="url(#glow-ai-chatbot)" opacity="0.3" class="shimmer-line" pointer-events="none" />
  </g>
</svg>
