<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60" fill="none">
  <defs>
    <linearGradient id="strip-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="50%" stop-color="#0E162D" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>
    <clipPath id="strip-clip">
      <rect width="900" height="60" rx="12" />
    </clipPath>
  </defs>

  <style>
    .strip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, monospace;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.3px;
      fill: #E6EDF3;
    }
    .strip-dot {
      fill: #22D3EE;
      opacity: 0.85;
    }
    @media (prefers-reduced-motion: no-preference) {
      .marquee-track {
        animation: marquee 45s linear infinite;
      }
    }
    @keyframes marquee {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-1100px); }
    }
  </style>

  <g clip-path="url(#strip-clip)">
    <rect width="900" height="60" rx="12" fill="url(#strip-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- Static fallback / Marquee track (all 8 items fit initially) -->
    <g class="marquee-track">
      <!-- Group 1 -->
      <g transform="translate(25, 39)">
        <text class="strip-text">
          React <tspan class="strip-dot">·</tspan> TypeScript <tspan class="strip-dot">·</tspan> Node.js <tspan class="strip-dot">·</tspan> Express <tspan class="strip-dot">·</tspan> Python <tspan class="strip-dot">·</tspan> Django <tspan class="strip-dot">·</tspan> PostgreSQL <tspan class="strip-dot">·</tspan> MongoDB <tspan class="strip-dot">·</tspan>
        </text>
      </g>
      <!-- Duplicate Group 2 for seamless loop -->
      <g transform="translate(1125, 39)">
        <text class="strip-text">
          React <tspan class="strip-dot">·</tspan> TypeScript <tspan class="strip-dot">·</tspan> Node.js <tspan class="strip-dot">·</tspan> Express <tspan class="strip-dot">·</tspan> Python <tspan class="strip-dot">·</tspan> Django <tspan class="strip-dot">·</tspan> PostgreSQL <tspan class="strip-dot">·</tspan> MongoDB <tspan class="strip-dot">·</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
